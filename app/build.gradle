apply plugin: 'com.android.application'

android {
    namespace 'com.relay.ws'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.relay.ws"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 19
        versionName "2.8.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Render the action-bar vector icons (e.g. the Settings gear) via the
        // support library so they work back to minSdkVersion 14.
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Name every built APK with its version, e.g. app-2.5.2.apk, so the artifact
    // is self-identifying when copied around or shared.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "app-${variant.versionName}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Let unmocked android.* calls (e.g. Log.e in error paths) return defaults
        // instead of throwing, so logic touching them stays JVM-unit-testable.
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    def work_version = "2.11.2"

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.work:work-runtime:$work_version"
    implementation 'org.apache.commons:commons-text:1.15.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "org.mockito:mockito-android:5.23.0"
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation "androidx.work:work-testing:$work_version"
}
